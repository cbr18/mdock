name: mdock_test

services:
  mdock:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mdock:test
    ports:
      - "${TEST_HTTP_PORT:-18080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      VAULTS_ROOT: "/vaults"
      DATA_DIR: "/data"
      BACKUP_DIR: "/backups"
      GIT_BIN: "${GIT_BIN:-git}"
      COMMIT_DEBOUNCE: "${COMMIT_DEBOUNCE:-1s}"
      LOCK_TTL: "${LOCK_TTL:-10s}"
      SESSION_TTL: "${SESSION_TTL:-1h}"
      COOKIE_SECURE: "false"
      API_BODY_LIMIT_BYTES: "${API_BODY_LIMIT_BYTES:-1048576}"
      WEBDAV_BODY_LIMIT_BYTES: "${WEBDAV_BODY_LIMIT_BYTES:-52428800}"
      AUTH_RATE_LIMIT_ATTEMPTS: "${AUTH_RATE_LIMIT_ATTEMPTS:-20}"
      AUTH_RATE_LIMIT_WINDOW: "${AUTH_RATE_LIMIT_WINDOW:-1m}"
      BOOTSTRAP_USERNAME: "${BOOTSTRAP_USERNAME:-admin}"
      BOOTSTRAP_PASSWORD: "${BOOTSTRAP_PASSWORD:-test-password}"
    volumes:
      - mdock_test_vaults:/vaults
      - mdock_test_data:/data
      - mdock_test_backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mdock_test_vaults:
  mdock_test_data:
  mdock_test_backups:

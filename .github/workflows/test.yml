name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - run: go build -mod=vendor -buildvcs=false ./cmd/mdock
      - run: npm ci
        working-directory: web
      - run: npm test -- --runInBand
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: docker compose config
      - run: docker compose --env-file test/.env.test.example -f test/docker-compose.yml config

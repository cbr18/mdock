name: mdock

services:
  mdock:
    build:
      context: .
      dockerfile: Dockerfile
    image: mdock:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      VAULTS_ROOT: "/vaults"
      DATA_DIR: "/data"
      BACKUP_DIR: "/backups"
      GIT_BIN: "${GIT_BIN:-git}"
      DEFAULT_FILE_ROOT: "${DEFAULT_FILE_ROOT:-Obsidian Vault}"
      COMMIT_DEBOUNCE: "${COMMIT_DEBOUNCE:-5s}"
      LOCK_TTL: "${LOCK_TTL:-30s}"
      SESSION_TTL: "${SESSION_TTL:-24h}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      API_BODY_LIMIT_BYTES: "${API_BODY_LIMIT_BYTES:-1048576}"
      WEBDAV_BODY_LIMIT_BYTES: "${WEBDAV_BODY_LIMIT_BYTES:-52428800}"
      AUTH_RATE_LIMIT_ATTEMPTS: "${AUTH_RATE_LIMIT_ATTEMPTS:-20}"
      AUTH_RATE_LIMIT_WINDOW: "${AUTH_RATE_LIMIT_WINDOW:-1m}"
      FIRST_ADMIN_TOKEN: "${FIRST_ADMIN_TOKEN:-}"
      BOOTSTRAP_USERNAME: "${BOOTSTRAP_USERNAME:-}"
      BOOTSTRAP_PASSWORD: "${BOOTSTRAP_PASSWORD:-}"
    volumes:
      - mdock_vaults:/vaults
      - mdock_data:/data
      - mdock_backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mdock_vaults:
  mdock_data:
  mdock_backups:

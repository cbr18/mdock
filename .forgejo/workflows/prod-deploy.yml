name: Prod Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: prod-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Test frontend
        run: npm test
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test backend
        run: go test ./...

      - name: Build backend
        run: go build -mod=vendor -buildvcs=false ./cmd/mdock

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_FINGERPRINT: ${{ secrets.PROD_SSH_FINGERPRINT }}
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
          PROD_REPO_SSH_URL: ssh://kotyonki.su:2288/cbr/mdock.git
        run: |
          set -euo pipefail

          : "${PROD_SSH_HOST:?PROD_SSH_HOST is required}"
          : "${PROD_SSH_USER:?PROD_SSH_USER is required}"
          : "${PROD_SSH_KEY:?PROD_SSH_KEY is required}"
          : "${PROD_SSH_FINGERPRINT:?PROD_SSH_FINGERPRINT is required}"
          : "${PROD_APP_DIR:?PROD_APP_DIR is required}"

          port="${PROD_SSH_PORT:-22}"
          key_path="$HOME/.ssh/mdock_prod_deploy"
          known_hosts_path="$HOME/.ssh/known_hosts"

          if ! command -v ssh >/dev/null 2>&1 || ! command -v ssh-keyscan >/dev/null 2>&1 || ! command -v ssh-keygen >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends openssh-client
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$key_path"
          sed -i 's/\r$//' "$key_path"
          chmod 600 "$key_path"

          if ! ssh-keygen -y -f "$key_path" >/dev/null 2>&1; then
            echo "PROD_SSH_KEY is not a valid private key" >&2
            exit 1
          fi

          ssh-keyscan -p "$port" "$PROD_SSH_HOST" > "$known_hosts_path"
          chmod 600 "$known_hosts_path"

          if ! ssh-keygen -lf "$known_hosts_path" | awk '{print $2}' | grep -Fx "$PROD_SSH_FINGERPRINT" >/dev/null; then
            echo "SSH host fingerprint mismatch for $PROD_SSH_HOST:$port" >&2
            echo "Expected: $PROD_SSH_FINGERPRINT" >&2
            echo "Actual fingerprints:" >&2
            ssh-keygen -lf "$known_hosts_path" >&2
            exit 1
          fi

          ssh \
            -i "$key_path" \
            -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "PROD_APP_DIR=$(printf '%q' "$PROD_APP_DIR") PROD_REPO_SSH_URL=$(printf '%q' "$PROD_REPO_SSH_URL") bash -s" <<'REMOTE'
            set -euo pipefail

            mkdir -p "$PROD_APP_DIR"
            cd "$PROD_APP_DIR"

            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git remote set-url origin "$PROD_REPO_SSH_URL"
            else
              if [ -e .git ]; then
                echo "PROD_APP_DIR contains invalid git metadata: $PROD_APP_DIR/.git" >&2
                echo "Move or remove that .git path on the server, then rerun deploy." >&2
                exit 1
              fi
              git init
              git remote add origin "$PROD_REPO_SSH_URL"
            fi

            git fetch --prune origin main
            git checkout -B main origin/main
            git pull --ff-only
            ./scripts/deploy-prod.sh
          REMOTE

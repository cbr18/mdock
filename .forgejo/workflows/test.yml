name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Test frontend
        run: npm test
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test backend
        run: go test ./...

      - name: Build backend
        run: go build -mod=vendor -buildvcs=false ./cmd/mdock

      - name: Validate production compose
        run: docker compose config

      - name: Validate test compose
        run: docker compose --env-file .env.test.example config
        working-directory: test

      - name: Start test stack
        run: docker compose up -d --build
        working-directory: test

      - name: Run smoke tests
        run: ./test/run-smoke.sh

      - name: Stop test stack
        if: always()
        run: docker compose down -v
        working-directory: test
